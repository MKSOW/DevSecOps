name: CI/CD Pipeline

on:
  push:
    branches: [master, preProd]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '20'

jobs:
  # =========================
  # 1. Lint & Tests unitaires
  # =========================
  test:
    name: Lint & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # =========================
  # 2. Sécurité (SAST + audit deps)
  # =========================
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: npm audit (vulnérabilités dans les dépendances)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

  # =========================
  # 3. Build & push Docker
  # =========================
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push for student version)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: helpdesk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan de l'image Docker
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'helpdesk:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # =========================
  # 4. Deploy Azure (master uniquement)
  # =========================
  # Le compte Azure for Students n'autorise pas la création d'un service
  # principal. Le déploiement repose donc sur le déploiement continu Azure :
  # ce job pousse l'image taggée :latest sur l'ACR, et un webhook ACR notifie
  # la Web App qui re-pull l'image automatiquement. La CI n'a besoin que des
  # identifiants de push ACR — aucun droit d'annuaire Entra ID requis.
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Le push du tag :latest déclenche le webhook ACR -> redéploiement Web App.
      - name: Build & push to ACR
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/helpdesk:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/helpdesk:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/helpdesk:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/helpdesk:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/helpdesk:latest

      - name: Smoke test post-déploiement
        run: |
          echo "Push terminé — le webhook ACR redéploie la Web App."
          sleep 90
          for i in $(seq 1 16); do
            if curl -sf -m 15 "https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health" | grep -q '"ok"'; then
              echo "Web App joignable et saine."
              exit 0
            fi
            echo "Attente du redéploiement... tentative $i"
            sleep 15
          done
          echo "La Web App n'a pas répondu OK dans le délai imparti."
          exit 1
